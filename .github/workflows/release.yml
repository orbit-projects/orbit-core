name: Build release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen --extra dev --extra server
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync ruff format --check src tests scripts examples
      - run: uv run --no-sync mypy src/orbit
      - run: uv run --no-sync pytest --cov=orbit
      - run: uv run --no-sync python scripts/check-license-headers.py
      - run: uv run --no-sync pip-audit --skip-editable --progress-spinner off
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync pip-audit --skip-editable --format cyclonedx-json --output dist/dependencies.cdx.json
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbit-core-distributions
          path: dist/
