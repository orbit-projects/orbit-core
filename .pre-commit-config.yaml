default_language_version:
  python: python3.11
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: license-headers
        name: license headers
        entry: python scripts/check-license-headers.py
        language: system
        pass_filenames: false
      - id: model-boundaries
        name: model boundaries
        entry: python scripts/check-model-boundaries.py
        language: system
        pass_filenames: false
      - id: documentation
        name: documentation policy
        entry: python scripts/check-documentation.py
        language: system
        pass_filenames: false
      - id: workflow-policy
        name: workflow policy
        entry: python scripts/check-workflows.py
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
