[tox]
env_list = py311, py312, py313, lint, type
isolated_build = true

[testenv]
extras = dev
commands = pytest {posargs}

[testenv:lint]
extras = dev
commands =
    ruff check src tests scripts
    ruff format --check src tests scripts
    python scripts/check-license-headers.py

[testenv:type]
extras = dev
commands = mypy src/orbit
